<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 108">
  <style>
    .forearm { transform-origin: 52px 49px; }
    @keyframes wave {
      0%, 52%, 100% { transform: rotate(4deg); }
      9%, 29% { transform: rotate(-16deg); }
      19%, 40% { transform: rotate(12deg); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .forearm { animation: wave 3.2s ease-in-out infinite; }
